# ==============================================================================
# miqumusic Configuration File
# Flagship Wayland MPD Music Player for Miquland
# ==============================================================================

# Dynamic color variables import (optional)
include = ~/.config/theme/current/miqumusic.colors

[general]
# Window initial dimensions
window_width = 960
window_height = 680

# Typography
font_family = Sans
font_size = 11

# Colors & Surface Styling
background = #12151cee
surface = #1a1e28dd
border_color = #ffffff1a
border_width = 1
corner_radius = 16
accent_color = #33b5e5

[mpd]
# MPD Connection
host = 127.0.0.1
port = 6600
music_directory = ~/Music

# Audio FIFO path for spectrum visualizer (defined in mpd.conf)
fifo_path = /tmp/mpd.fifo
